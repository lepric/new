<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Напоминания об оплате</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/vk-bridge.js"></script>
    <script src="vk-config.js"></script>
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>Напоминания об оплате</h1>
        </header>
        
        <main class="main-content">
            <!-- Экран выбора действия -->
            <div id="action-screen" class="screen active">
                <button id="create-reminder-btn" class="action-btn">Создать напоминание</button>
                <button id="delete-reminder-btn" class="action-btn">Удалить напоминание</button>
                <button id="show-reminders-btn" class="action-btn">Показать напоминания</button>
            </div>
            
            <!-- Форма создания напоминания - шаг 1 -->
            <div id="step1-screen" class="screen">
                <div class="form-container">
                    <h2>Создание напоминания</h2>
                    <p class="step-indicator">Шаг 1 из 4: Название напоминания</p>
                    
                    <input type="text" id="reminder-title" placeholder="Введите название напоминания" maxlength="50">
                    <div class="button-group">
                        <button id="back-to-main" class="btn-secondary">Назад</button>
                        <button id="next-step1" class="btn-primary">Далее</button>
                    </div>
                </div>
            </div>
            
            <!-- Форма создания напоминания - шаг 2 -->
            <div id="step2-screen" class="screen">
                <div class="form-container">
                    <h2>Создание напоминания</h2>
                    <p class="step-indicator">Шаг 2 из 4: Текст напоминания</p>
                    
                    <textarea id="reminder-text" placeholder="Введите текст напоминания" maxlength="200"></textarea>
                    <div class="button-group">
                        <button id="prev-step2" class="btn-secondary">Назад</button>
                        <button id="next-step2" class="btn-primary">Далее</button>
                    </div>
                </div>
            </div>
            
            <!-- Форма создания напоминания - шаг 3 -->
            <div id="step3-screen" class="screen">
                <div class="form-container">
                    <h2>Создание напоминания</h2>
                    <p class="step-indicator">Шаг 3 из 4: Когда отправлять напоминания</p>
                    
                    <label for="reminder-date">Дата:</label>
                    <input type="date" id="reminder-date">
                    
                    <label for="reminder-time">Время:</label>
                    <input type="time" id="reminder-time">
                    
                    <div class="button-group">
                        <button id="prev-step3" class="btn-secondary">Назад</button>
                        <button id="next-step3" class="btn-primary">Далее</button>
                    </div>
                </div>
            </div>
            
            <!-- Форма создания напоминания - шаг 4 -->
            <div id="step4-screen" class="screen">
                <div class="form-container">
                    <h2>Создание напоминания</h2>
                    <p class="step-indicator">Шаг 4 из 4: Периодичность</p>
                    
                    <div class="radio-group">
                        <label><input type="radio" name="frequency" value="once" checked> Один раз</label>
                        <label><input type="radio" name="frequency" value="daily"> Каждый день</label>
                        <label><input type="radio" name="frequency" value="weekly"> Раз в неделю</label>
                        <label><input type="radio" name="frequency" value="monthly"> Раз в месяц</label>
                        <label><input type="radio" name="frequency" value="quarterly"> Раз в квартал</label>
                        <label><input type="radio" name="frequency" value="yearly"> Раз в год</label>
                    </div>
                    
                    <div class="button-group">
                        <button id="prev-step4" class="btn-secondary">Назад</button>
                        <button id="finish-creation" class="btn-primary">Создать напоминание</button>
                    </div>
                </div>
            </div>
            
            <!-- Экран просмотра напоминаний -->
            <div id="reminders-screen" class="screen">
                <div class="form-container">
                    <h2>Ваши напоминания</h2>
                    <div id="reminders-list">
                        <!-- Список напоминаний будет добавлен здесь -->
                    </div>
                    <button id="back-to-main-from-list" class="btn-secondary">Назад</button>
                </div>
            </div>
            
            <!-- Экран удаления напоминаний -->
            <div id="delete-screen" class="screen">
                <div class="form-container">
                    <h2>Удалить напоминание</h2>
                    <div id="delete-reminders-list">
                        <!-- Список напоминаний для удаления будет добавлен здесь -->
                    </div>
                    <button id="back-to-main-from-delete" class="btn-secondary">Назад</button>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
